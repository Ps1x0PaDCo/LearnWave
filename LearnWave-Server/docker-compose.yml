version: '3.8'
services:
  db:
    image: postgres:15
    container_name: learnwave_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: master_password
      POSTGRES_DB: learnwave_main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
